<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icoonvarianten</title>
<style>
body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: #F6F4EE; color: #1C2B22; }
h1 { font-size: 22px; margin: 0 0 12px; }
.v { display: grid; grid-template-columns: 160px repeat(4, auto); gap: 16px; align-items: center;
     background: #fff; border: 1px solid #DAD6CB; border-radius: 14px; padding: 12px; margin-bottom: 12px; }
.v h2 { font-size: 17px; margin: 0; }
img.big { width: 160px; height: 160px; }
img.mid { width: 60px; height: 60px; }
img.small { width: 32px; height: 32px; }
.round { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; }
.round img { width: 60px; height: 60px; transform: scale(1.0); }
.dark { background: #141A16; padding: 8px; border-radius: 10px; }
</style></head><body>
<h1>Icoonvarianten — marker met wandelschoen</h1>
<div class="v"><div><h2>1-marker-groen</h2><img class="big" src="1-marker-groen.svg" alt=""></div><img class="mid" src="1-marker-groen.svg" alt=""><img class="small" src="1-marker-groen.svg" alt=""><div class="round"><img src="1-marker-groen.svg" alt=""></div><div class="dark"><img class="mid" src="1-marker-groen.svg" alt=""></div></div>
<div class="v"><div><h2>2-marker-licht</h2><img class="big" src="2-marker-licht.svg" alt=""></div><img class="mid" src="2-marker-licht.svg" alt=""><img class="small" src="2-marker-licht.svg" alt=""><div class="round"><img src="2-marker-licht.svg" alt=""></div><div class="dark"><img class="mid" src="2-marker-licht.svg" alt=""></div></div>
<div class="v"><div><h2>3-schoen-met-marker</h2><img class="big" src="3-schoen-met-marker.svg" alt=""></div><img class="mid" src="3-schoen-met-marker.svg" alt=""><img class="small" src="3-schoen-met-marker.svg" alt=""><div class="round"><img src="3-schoen-met-marker.svg" alt=""></div><div class="dark"><img class="mid" src="3-schoen-met-marker.svg" alt=""></div></div>
<div class="v"><div><h2>4-marker-met-pad</h2><img class="big" src="4-marker-met-pad.svg" alt=""></div><img class="mid" src="4-marker-met-pad.svg" alt=""><img class="small" src="4-marker-met-pad.svg" alt=""><div class="round"><img src="4-marker-met-pad.svg" alt=""></div><div class="dark"><img class="mid" src="4-marker-met-pad.svg" alt=""></div></div>
<div class="v"><div><h2>5-marker-donker</h2><img class="big" src="5-marker-donker.svg" alt=""></div><img class="mid" src="5-marker-donker.svg" alt=""><img class="small" src="5-marker-donker.svg" alt=""><div class="round"><img src="5-marker-donker.svg" alt=""></div><div class="dark"><img class="mid" src="5-marker-donker.svg" alt=""></div></div>
</body></html>
